<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RIBEL — Maison témoin 1500 (prototype)</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#c7d4d5;font:14px system-ui;color:#fff}canvas{display:block}aside{position:absolute;top:12px;left:12px;max-width:330px;background:#17221fdb;padding:12px 15px;border-radius:9px;line-height:1.5}aside small{display:block;color:#d6dcd5}button{position:absolute;right:12px;bottom:16px;background:#1f302a;color:white;border:1px solid #aebdb4;border-radius:8px;padding:11px}a{color:#fff}</style>
</head><body><aside><b>RIBEL · Maison témoin vers 1500</b><small>Étude volumétrique — pas un modèle patrimonial attesté. Glisser pour tourner, pincer ou défiler pour zoomer. Aucune modification du village public.</small></aside><button id="reset">Recentrer</button>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xb9c9cd);scene.fog=new THREE.Fog(0xb9c9cd,32,85);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,100);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;document.body.append(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe6efff,0x8b806d,2.2));const sun=new THREE.DirectionalLight(0xffdfb3,3.1);sun.position.set(-8,15,12);scene.add(sun);
const mat=(c,roughness=1)=>new THREE.MeshStandardMaterial({color:c,roughness});
const limestone=mat(0xb9aa8f),plaster=mat(0xd8c7a4),wood=mat(0x5b4030),woodLight=mat(0x7e5b3f),slate=mat(0x464e58),glass=mat(0x5d7476,.28),earth=mat(0x96846a),iron=mat(0x383a37);
function box(w,h,d,x,y,z,m){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);scene.add(o);return o}
function beam(a,b,r,m){const v=new THREE.Vector3(...a),w=new THREE.Vector3(...b),delta=w.clone().sub(v);const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r,r,delta.length(),6),m);mesh.position.copy(v).add(w).multiplyScalar(.5);mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),delta.normalize());scene.add(mesh)}
function windowAt(x,y,z){box(.95,1.2,.07,x,y,z,wood);box(.74,1.0,.085,x,y,z+.045,glass);box(.09,1.12,.1,x,y,z+.11,woodLight);box(.84,.085,.1,x,y,z+.12,woodLight);box(1.13,.14,.32,x,y-.66,z+.08,limestone)}
box(200,.2,200,0,-.14,0,earth);box(7.9,3.0,5.8,0,1.5,0,limestone);box(8.5,2.85,6.1,0,4.36,0,plaster);
for(const y of [3.05,5.72]){box(8.7,.2,6.3,0,y,0,wood)}
for(const x of [-4.18,-2.1,0,2.1,4.18]){box(.19,2.6,.18,x,4.38,3.11,wood);box(.19,2.6,.18,x,4.38,-3.11,wood)}
for(const x of [-3.2,-1.1,1.1,3.2]){beam([x-1.0,3.15,3.17],[x+1.0,5.58,3.17],.085,woodLight)}
for(const y of [3.15,5.58]){box(8.7,.15,.18,0,y,3.16,wood)}
for(const x of [-2.6,0,2.6])windowAt(x,4.55,3.23);
box(1.35,2.55,.12,-2,1.28,2.98,wood);box(.09,2.5,.14,-2,1.28,3.08,woodLight);box(1.45,.18,.4,-2,2.58,3.08,limestone);
for(const x of [.1,2.5])windowAt(x,1.75,3.04);
const roofAngle=Math.atan2(2.85,3.65),slope=Math.hypot(2.85,3.65);
for(const side of [-1,1]){const roof=box(9.4,.20,slope+.45,0,7.18,side*1.78,slate);roof.rotation.x=side*roofAngle}
for(const z of [-3.12,3.12]){const shape=new THREE.Shape();shape.moveTo(-4.23,5.77);shape.lineTo(4.23,5.77);shape.lineTo(0,8.65);shape.closePath();const g=new THREE.ShapeGeometry(shape);const o=new THREE.Mesh(g,plaster);o.position.z=z;scene.add(o);beam([-4.23,5.77,z],[0,8.65,z],.12,wood);beam([0,8.65,z],[4.23,5.77,z],.12,wood);beam([-4.23,5.77,z],[4.23,5.77,z],.12,wood)}
box(.78,1.4,.72,2.7,8.65,-.7,limestone);box(.92,.22,.9,2.7,9.4,-.7,limestone);
for(let i=0;i<14;i++){const x=-5.6+i*.9;box(.6,.035,1.1,x,.015,4.8,limestone)}
let theta=.7,phi=1.04,dist=19,target=new THREE.Vector3(0,4,0);let touches=new Map(),oldPinch=null;
function update(){camera.position.set(target.x+dist*Math.sin(phi)*Math.sin(theta),target.y+dist*Math.cos(phi),target.z+dist*Math.sin(phi)*Math.cos(theta));camera.lookAt(target)}
update();
renderer.domElement.addEventListener('pointerdown',e=>{renderer.domElement.setPointerCapture(e.pointerId);touches.set(e.pointerId,[e.clientX,e.clientY])});
renderer.domElement.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;let old=touches.get(e.pointerId);touches.set(e.pointerId,[e.clientX,e.clientY]);if(touches.size===1){theta-=(e.clientX-old[0])*.007;phi=Math.max(.25,Math.min(2.7,phi+(e.clientY-old[1])*.007))}else{let pts=[...touches.values()];let pinch=Math.hypot(pts[0][0]-pts[1][0],pts[0][1]-pts[1][1]);if(oldPinch!==null)dist=Math.max(10,Math.min(34,dist*oldPinch/pinch));oldPinch=pinch}update()});
function end(e){touches.delete(e.pointerId);oldPinch=null}renderer.domElement.addEventListener('pointerup',end);renderer.domElement.addEventListener('pointercancel',end);
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(10,Math.min(34,dist+e.deltaY*.012));update()},{passive:false});
document.getElementById('reset').onclick=()=>{theta=.7;phi=1.04;dist=19;update()};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
renderer.setAnimationLoop(()=>renderer.render(scene,camera));
</script></body></html>
