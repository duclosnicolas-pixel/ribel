<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RIBEL · Village 1500 · Maquette UX</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#b4c8d0;color:#f5f0e5;font:14px system-ui}canvas{display:block;touch-action:none}
.panel{position:fixed;top:12px;left:12px;max-width:min(370px,calc(100vw - 24px));background:#17231fdd;padding:13px;border:1px solid #ffffff26;border-radius:10px;line-height:1.4}
.panel b{font-size:16px}.panel p{margin:5px 0 0;color:#e4e1d7;font-size:12px}
.toolbar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:#18241fe8;padding:7px;border-radius:11px;max-width:calc(100vw - 16px);overflow:auto}
button{color:white;background:#40594d;border:1px solid #9db4a2;border-radius:7px;padding:10px;white-space:nowrap;cursor:pointer}button:focus-visible{outline:2px solid white}
.tag{position:fixed;right:12px;top:12px;background:#17231fdd;padding:7px 9px;border-radius:8px;font-size:12px}
</style></head><body>
<div class="panel"><b>RIBEL — Village vers 1500</b><p>Maquette architecturale en cours. Place volontairement dégagée, fontaine centrale, maisons médiévales resserrées, écuries au nord, grenier à blé à l'est et seuil paroissial au sud. Glisser pour tourner ; pincer ou défiler pour zoomer.</p></div>
<div class="tag" id="status">Vue générale</div>
<div class="toolbar"><button data-view="overview">Vue générale</button><button data-view="north">Depuis le nord</button><button data-view="center">Depuis la fontaine</button><button data-view="east">Vers l'est</button><button data-view="south">Vers le sud</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xb8cbd0);scene.fog=new THREE.Fog(0xb8cbd0,105,220);
const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,400);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.16;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe4f0ff,0x77745e,2.0));const sun=new THREE.DirectionalLight(0xffe3b7,2.9);sun.position.set(-35,70,30);scene.add(sun);
const mat=(color,roughness=1)=>new THREE.MeshStandardMaterial({color,roughness});
const grass=mat(0x6d8760),ground=mat(0x99866b),road=mat(0xb4a28a),stone=mat(0xb3a993),water=mat(0x668f96,.24),wood=[mat(0x604536),mat(0x79543d),mat(0x4d4137)],plaster=[mat(0xd9c6a6),mat(0xc6b698),mat(0xe2d4b8),mat(0xbda88d)],roof=[mat(0x545861),mat(0x71685e),mat(0x65594e),mat(0x484e55)],dark=mat(0x343a36);
function box(w,h,d,x,y,z,m,parent=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);parent.add(o);return o}
function cylinder(r1,r2,h,x,y,z,m,n=16,parent=scene){const o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,n),m);o.position.set(x,y,z);parent.add(o);return o}
function path(x1,z1,x2,z2,width,m){const len=Math.hypot(x2-x1,z2-z1),o=box(width,.035,len,(x1+x2)/2,.035,(z1+z2)/2,m);o.rotation.y=Math.atan2(x2-x1,z2-z1);return o}
box(230,.3,230,0,-.25,0,grass);
const oval=new THREE.Mesh(new THREE.CircleGeometry(1,72),ground);oval.rotation.x=-Math.PI/2;oval.scale.set(43,16,1);oval.position.y=-.06;scene.add(oval);
path(0,-112,0,112,6,road);path(-110,0,110,0,5.4,road);
const cobble=mat(0xb8a990);for(let i=0;i<900;i++){let x=(Math.random()-.5)*85,z=(Math.random()-.5)*31;if((x*x)/(43*43)+(z*z)/(16*16)>1)continue;const o=box(.45+Math.random()*.55,.02,.3+Math.random()*.5,x,.006,z,cobble);o.rotation.y=Math.random()*3}
function roofGable(group,w,d,h,y,r){const shape=new THREE.Shape();shape.moveTo(-w/2,y);shape.lineTo(0,y+h);shape.lineTo(w/2,y);shape.closePath();const geo=new THREE.ExtrudeGeometry(shape,{depth:d,bevelEnabled:false});const mesh=new THREE.Mesh(geo,r);mesh.position.z=-d/2;group.add(mesh)}
function house(x,z,rot,w,d,h,seed,kind='house'){const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;scene.add(g);
const p=plaster[seed%plaster.length],b=wood[seed%wood.length],r=roof[seed%roof.length];
box(w,h,d,0,h/2,0,p,g);box(w+.25,.22,d+.2,0,h*.53,0,b,g);
const floors=kind==='house'&&seed%3!==0?2:1;if(floors===2){box(w+.28,1.9,d+.28,0,h+.95,0,p,g);for(const side of [-1,1]){for(let i=0;i<4;i++){const xx=-w/2+i*w/3;box(.14,1.85,.14,xx,h+.95,side*(d/2+.16),b,g)}box(w+.3,.14,.16,0,h+.2,side*(d/2+.17),b,g);box(w+.3,.14,.16,0,h+1.75,side*(d/2+.17),b,g)}}
const top=h+(floors===2?1.9:0);roofGable(g,w+.7,d+.7,Math.min(3.7,w*.56)+(seed%3)*.25,top,r);
// Trame de colombage et contreventements sur les façades supérieures.
if(floors===2){for(let j=0;j<3;j++){const xx=-w*.33+j*w*.33;const brace=box(.12,1.5,.12,xx,h+1.0,d/2+.22,b,g);brace.rotation.z=(j%2===0?1:-1)*.48}}
if(seed%4===0){const dormer=box(1.1,.95,1.15,w*.18,top+1.55,d*.16,plaster[(seed+1)%4],g);const cap=box(1.5,.18,1.45,w*.18,top+2.08,d*.16,r,g);cap.rotation.z=.14}
const front=d/2+.06;box(1.05,1.75,.14,-w*.22,.9,front,b,g);
for(let k=0;k<(w>7?3:2);k++){let xx=-w*.24+k*w*.25;if(Math.abs(xx+w*.22)<.65)continue;box(.72,.95,.14,xx,1.6,front,b,g);box(.5,.75,.16,xx,1.6,front,mat(0x637d7c,.35),g)}
if(floors===2)for(let k=0;k<3;k++){const xx=-w*.25+k*w*.25;box(.72,.95,.13,xx,h+1.05,front+.15,b,g);box(.5,.75,.15,xx,h+1.05,front+.17,mat(0x70817b,.35),g)}
if(seed%2===0){box(.8,1.3,.8,w*.25,top+2,-d*.15,stone,g)}
return g}
// Façades serrées autour de l'ovale ; percées conservées aux quatre axes.
const count=38;for(let i=0;i<count;i++){const a=2*Math.PI*(i+.3)/count;const x=48*Math.cos(a),z=22*Math.sin(a);if(Math.abs(x)<8&&Math.abs(z)>17)continue;if(Math.abs(z)<5&&Math.abs(x)>39)continue;const w=5.1+(i*7%4),d=5.2+(i*3%3),h=3.1+(i%5)*.34;house(x,z,Math.atan2(-x,-z),w,d,h,i)}
// Deuxième front bâti irrégulier : densité de l'image de référence, sans condamner les axes.
for(let i=0;i<30;i++){const a=2*Math.PI*(i+.6)/30;const x=(66+(i%3)*2)*Math.cos(a),z=(38+(i%4)*2)*Math.sin(a);
if(Math.abs(x)<12&&Math.abs(z)>28)continue;if(Math.abs(z)<9&&Math.abs(x)>55)continue;
house(x,z,Math.atan2(-x,-z)+(i%3-1)*.15,5.6+(i%4),5+(i%3),3.0+(i%5)*.38,50+i)}
// Maisons de liaison en profondeur, hors place et chemins principaux.
for(let i=0;i<16;i++){const a=2*Math.PI*(i+.4)/16;const x=82*Math.cos(a),z=54*Math.sin(a);
if(Math.abs(x)<16&&Math.abs(z)>42)continue;if(Math.abs(z)<10&&Math.abs(x)>70)continue;
house(x,z,Math.atan2(-x,-z),5.8+(i%3),5.4+(i%2),2.9+(i%4)*.32,90+i)}
// Fountain: central landmark
cylinder(3.35,3.55,.58,0,.31,0,stone,24);cylinder(2.82,2.82,.08,0,.65,0,water,24);cylinder(.42,.65,2.1,0,1.6,0,stone,12);cylinder(1.0,.7,.28,0,2.68,0,stone,20);cylinder(.35,.35,.5,0,3.03,0,water,12);
// Place centrale volontairement libre : aucun étal ou table permanente.\n// Granary east, visibly distinct
const granary=house(78,1,Math.PI/2,13,8,4.7,7,'granary');box(12,.45,1.4,78,.3,-6.1,stone);
for(let i=0;i<6;i++)cylinder(.52,.52,.9,71+i*2.2,.5,-8,wood[1],9);
// Stables north and castle-bound threshold
house(-12,-76,0,15,9,3.3,3,'stable');house(12,-76,0,15,9,3.3,5,'stable');
for(let x of [-5,5])box(1.1,4.7,1.1,x,2.35,-91,stone);box(11,1.2,1.6,0,5.1,-91,stone);
// Parish threshold south, NOT detailed parish zone
for(let x of [-5,5])box(1.1,3.5,1.1,x,1.75,88,stone);box(11,.6,1.2,0,3.8,88,stone);
// Low detail trees around village
const foliage=[mat(0x4f7150),mat(0x597c51),mat(0x6a8056)];for(let i=0;i<130;i++){const a=Math.random()*Math.PI*2,rr=67+Math.random()*45,x=Math.cos(a)*rr,z=Math.sin(a)*rr;if(Math.abs(x)<13&&(z<-63||z>68))continue;if(x>68&&Math.abs(z)<12)continue;cylinder(.22,.34,2.5,x,1.25,z,wood[2],7);const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(1.8+Math.random()*1.6,0),foliage[i%3]);crown.position.set(x,3.5,z);scene.add(crown)}
let target=new THREE.Vector3(0,0,0),theta=.52,phi=.55,dist=135;
const views={overview:{theta:.52,phi:.55,dist:135,target:[0,0,0],label:'Vue générale'},north:{theta:Math.PI,phi:1.36,dist:73,target:[0,2,-18],label:'Arrivée nord'},center:{theta:0,phi:1.42,dist:26,target:[0,2,-12],label:'Depuis la fontaine'},east:{theta:Math.PI/2,phi:1.36,dist:55,target:[34,3,0],label:'Vers le grenier est'},south:{theta:0,phi:1.32,dist:69,target:[0,2,27],label:'Vers la paroisse sud'}};
function update(){camera.position.set(target.x+dist*Math.sin(phi)*Math.sin(theta),target.y+dist*Math.cos(phi),target.z+dist*Math.sin(phi)*Math.cos(theta));camera.lookAt(target)}
function setView(k){const v=views[k];theta=v.theta;phi=v.phi;dist=v.dist;target.set(...v.target);document.getElementById('status').textContent=v.label;update()}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
let pointers=new Map(),pinch=null;
renderer.domElement.addEventListener('pointerdown',e=>{renderer.domElement.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY])});
renderer.domElement.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===1){theta-=(e.clientX-old[0])*.006;phi=Math.max(.17,Math.min(2.65,phi+(e.clientY-old[1])*.006))}else{const pts=[...pointers.values()],d=Math.hypot(pts[0][0]-pts[1][0],pts[0][1]-pts[1][1]);if(pinch)dist=Math.max(9,Math.min(205,dist*pinch/d));pinch=d}update()});
function end(e){pointers.delete(e.pointerId);pinch=null}renderer.domElement.addEventListener('pointerup',end);renderer.domElement.addEventListener('pointercancel',end);
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(9,Math.min(205,dist+e.deltaY*.09));update()},{passive:false});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
setView('overview');renderer.setAnimationLoop(()=>renderer.render(scene,camera));
</script></body></html>
