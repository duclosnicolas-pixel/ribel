<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RIBEL · Module de l’auberge</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
:root { --ink: #16201b; --glass: #16201bdd; --linen: #f3ecdf; --rule: #a7b3a3; --ok: #9ccf9a; --over: #e59a87; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #c4d0cf; color: var(--linen); font: 14px/1.4 system-ui, sans-serif; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.panel { position: fixed; background: var(--glass); border-radius: 10px; padding: 10px 12px; }
#info { top: 12px; left: 12px; right: 12px; max-width: 520px; }
#info strong { display: block; font-size: 15px; }
#stats { font: 600 12px/1.5 ui-monospace, monospace; margin-top: 6px; }
#stats b[data-ok="1"] { color: var(--ok); } #stats b[data-ok="0"] { color: var(--over); }
#bar { bottom: 12px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
button { min-height: 44px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--rule); background: #2f4438; color: var(--linen); font: inherit; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="panel" id="info"><strong>Auberge du Foyer d'Or — module de bâtiment seul</strong>
<span>Modèle Meshy allégé, éclairé comme le village. Glisser pour tourner autour. Vert : où l'on peut se tenir (terrasse, arcades, encorbellement). Les portes restent fermées.</span>
<div id="stats">Chargement…</div></div>
<div class="panel" id="bar">
  <button data-view="facade">Façade</button><button data-view="terrasse">Terrasse</button><button data-view="arriere">Arrière</button><button data-view="haut">Vue haute</button>
  <button id="navbtn">Montrer la circulation</button>
</div>
<script type="module">
const THREE = await import('three');
const { createBuilding } = await import('../zones/05-village/02-taverne/index.js');
const { assertBuildingInstance } = await import('../core/contracts.js');

// Éclairage et rendu identiques au village : c'est ainsi que le bâtiment y apparaîtra.
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc5d3dc);
scene.fog = new THREE.Fog(0xc5d3dc, 80, 480);
scene.add(new THREE.HemisphereLight(0xe9eef3, 0x8b8572, 1.4));
const sun = new THREE.DirectionalLight(0xfff0d8, 2.2); sun.position.set(-60, 90, 40); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400, 20, 20), new THREE.MeshLambertMaterial({ color: 0x849778 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.02; scene.add(ground);
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 600);

const t0 = performance.now();
const building = assertBuildingInstance(createBuilding({ THREE, maxAnisotropy: renderer.capabilities.getMaxAnisotropy() }, {}));
scene.add(building.root);
let loadMs = null;
building.ready.then(() => { loadMs = Math.round(performance.now() - t0); buildNavOverlay(); }).catch((e) => { document.getElementById('stats').textContent = 'Erreur : ' + e.message; });

// Calque de circulation : pastilles vertes là où l'on peut se tenir debout.
let navOverlay = null;
function buildNavOverlay() {
  const pts = [];
  for (let z = -7.1; z < 9; z += 0.144) for (let x = -8.1; x < 8; x += 0.144) if (building.isFloor(x, z)) pts.push(x, building.floorHeight(x, z) + 0.06, z);
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  navOverlay = new THREE.Points(g, new THREE.PointsMaterial({ color: 0x2fdc4a, size: 0.09, depthWrite: false, transparent: true, opacity: 0.85 }));
  navOverlay.visible = false; building.root.add(navOverlay);
}
document.getElementById('navbtn').onclick = () => {
  if (!navOverlay) return;
  navOverlay.visible = !navOverlay.visible;
  document.getElementById('navbtn').textContent = navOverlay.visible ? 'Masquer la circulation' : 'Montrer la circulation';
};

// Vues : [x, y, z] de l'œil, [x, y, z] visé (repère local, façade principale vers +z).
const views = { facade: [[0, 1.6, 20], [0, 3, 0]], terrasse: [[-12, 1.6, 9], [-5, 1, 3]], arriere: [[-6, 1.6, -16], [-3, 2, -3]], haut: [[0, 34, 26], [0, 0, 1]] };
let orbit = { target: new THREE.Vector3(), yaw: 0, pitch: 0, dist: 1 };
function setView(name) {
  const [eye, at] = views[name];
  orbit.target.set(...at);
  const d = new THREE.Vector3(...eye).sub(orbit.target);
  orbit.dist = d.length(); orbit.yaw = Math.atan2(d.x, d.z); orbit.pitch = Math.asin(d.y / orbit.dist);
  applyOrbit();
}
function applyOrbit() {
  orbit.pitch = Math.max(-0.2, Math.min(1.45, orbit.pitch));
  const c = Math.cos(orbit.pitch);
  camera.position.set(orbit.target.x + orbit.dist * c * Math.sin(orbit.yaw), Math.max(0.4, orbit.target.y + orbit.dist * Math.sin(orbit.pitch)), orbit.target.z + orbit.dist * c * Math.cos(orbit.yaw));
  camera.lookAt(orbit.target);
}
document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));
setView('facade');

let drag = null;
canvas.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
  orbit.yaw -= dx * 0.005; orbit.pitch += dy * 0.004; applyOrbit();
});
canvas.addEventListener('pointerup', () => { drag = null; });
canvas.addEventListener('wheel', (e) => { orbit.dist = Math.max(3, Math.min(160, orbit.dist * Math.exp(e.deltaY * 0.001))); applyOrbit(); }, { passive: true });

function resize() { const W = innerWidth, H = innerHeight; renderer.setSize(W, H, false); camera.aspect = W / H; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const stats = document.getElementById('stats');
let last = performance.now(), frames = 0, acc = 0, fps = 0;
renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  building.update(dt, {});
  renderer.render(scene, camera);
  frames++; acc += dt; if (acc > 0.5) { fps = Math.round(frames / acc); frames = 0; acc = 0; }
  const calls = renderer.info.render.calls, tris = renderer.info.render.triangles;
  if (loadMs !== null) stats.innerHTML = `${fps} i/s · appels <b data-ok="1">${calls}</b> · triangles <b data-ok="${tris <= 100000 ? 1 : 0}">${Math.round(tris / 1000)} k</b> (modèle ≈ 78 k) · chargé en ${loadMs} ms`;
});
window.ribelModule = { building, setView, showNav: (on) => { if (navOverlay) navOverlay.visible = on; }, stats: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles, loadMs, model: building.stats() }) };
</script>
</body>
</html>
